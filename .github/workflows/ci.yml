name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test and clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  security_audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches the compiled cargo-audit binary as well as the registry, so this
      # job is fast after its first run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audits the committed Cargo.lock against the RustSec advisory database.
      # Needs no secrets and no token. Fails on vulnerabilities; unmaintained and
      # unsound advisories are printed as warnings, because the current ones come
      # from ratatui's own tree and cannot be fixed here.
      - name: cargo audit
        run: cargo audit
