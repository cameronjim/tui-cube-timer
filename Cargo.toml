[package]
name = "cubetimer"
version = "0.1.0"
edition = "2021"
description = "A speedcube timer TUI: scrambles, inspection, ao5/ao12/ao100, PBs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
directories = "6"
# Pinned: parking_lot_core >=0.9.11 switched to windows-link (raw-dylib), which on
# the windows-gnu toolchain requires dlltool + a mingw assembler this machine lacks.
# 0.9.10 uses windows-targets with prebuilt import libs and builds cleanly.
# Remove these pins if you install mingw-w64 binutils or switch to the MSVC toolchain.
parking_lot = "=0.12.3"
parking_lot_core = "=0.9.10"

[profile.release]
lto = true
